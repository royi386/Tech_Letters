name: tech-letters

services:
  portal:
    image: ghcr.io/royi386/tech-letters:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "5173"
      COOKIE_SECURE: "${COOKIE_SECURE:-1}"
    ports:
      - "${PORT_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    volumes:
      - portal_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/api/state').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  portal_data: